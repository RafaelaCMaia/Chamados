
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Chamados</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f5f7;
            color: #333;
        }

        header {
            background-color: #263b60;
            color: white;
            padding: 20px 35px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }

        h2 {
            font-size: 19px;
            margin-top: 0;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            background-color: #263b60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f0f2f5;
        }

        .observacao {
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <h1>Sistema de Chamados</h1>
    <p>Gerenciamento de suporte técnico</p>
</header>

<div class="container">

    <div class="card">
        <h2>Chamados cadastrados</h2>

        <button onclick="listarChamados()">Atualizar lista</button>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="tabelaChamados">
                <tr>
                    <td colspan="3">Carregando...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h2>Cadastrar chamado</h2>

        <form id="formChamado">
            <input type="text" id="titulo"
                   placeholder="Título do chamado" required>

            <textarea id="descricao"
                      placeholder="Descrição do problema"
                      required></textarea>

            <input type="number" id="clienteId"
                   placeholder="ID do cliente" required min="1">

            <input type="number" id="categoriaId"
                   placeholder="ID da categoria" required min="1">

            <input type="number" id="tecnicoId"
                   placeholder="ID do técnico (opcional)" min="1">

            <button type="submit">Cadastrar</button>
        </form>

        <p id="mensagem"></p>
    </div>

    <div class="card">
        <h2>Outras funcionalidades</h2>
        <p class="observacao">
            Área reservada para gerenciamento de técnicos,
            clientes, categorias e comentários.
        </p>
    </div>

</div>

<script>
    const url = "/api/chamados";

    async function listarChamados() {
        const tabela = document.getElementById("tabelaChamados");

        try {
            const resposta = await fetch(url);
            if (!resposta.ok) {
                throw new Error("Erro ao consultar chamados");
            }

            const chamados = await resposta.json();
            tabela.innerHTML = "";

            if (chamados.length === 0) {
                tabela.innerHTML =
                    "<tr><td colspan='3'>Nenhum chamado encontrado</td></tr>";
                return;
            }

            chamados.forEach(chamado => {
                const linha = document.createElement("tr");

                [chamado.id, chamado.titulo, chamado.status].forEach(valor => {
                    const coluna = document.createElement("td");
                    coluna.textContent = valor;
                    linha.appendChild(coluna);
                });

                tabela.appendChild(linha);
            });

        } catch (erro) {
            tabela.innerHTML =
                "<tr><td colspan='3'>Erro ao carregar chamados</td></tr>";
            console.error(erro);
        }
    }

    document.getElementById("formChamado")
        .addEventListener("submit", async function(evento) {
            evento.preventDefault();

            const tecnico = document.getElementById("tecnicoId").value;

            const chamado = {
                titulo: document.getElementById("titulo").value,
                descricao: document.getElementById("descricao").value,
                clienteId: Number(document.getElementById("clienteId").value),
                categoriaId: Number(document.getElementById("categoriaId").value),
                tecnicoId: tecnico ? Number(tecnico) : null
            };

            const mensagem = document.getElementById("mensagem");

            try {
                const resposta = await fetch(url, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(chamado)
                });

                if (!resposta.ok) {
                    throw new Error("Erro ao cadastrar chamado");
                }

                mensagem.textContent = "Chamado cadastrado com sucesso!";
                this.reset();
                listarChamados();

            } catch (erro) {
                mensagem.textContent = "Não foi possível cadastrar o chamado.";
                console.error(erro);
            }
        });

    listarChamados();
</script>

</body>
</html>
